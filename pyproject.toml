[project]
name = "booking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suicao01", email = "anhthoho000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "deepagents>=0.7.13",
    "fastapi>=0.141.1",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-docker-backend>=1.0.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langfuse>=4.15.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-swarm>=0.1.0",
    "loguru>=0.7.3",
    "mcp>=1.30.0",
    "psycopg[binary]>=3.3.5",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
booking = "booking:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
